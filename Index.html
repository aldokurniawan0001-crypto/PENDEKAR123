                --red-gradient: linear-gradient(180deg, rgba(60, 6, 12, 0.95), rgba(20, 2, 4, 0.98));
                --muted: rgba(243, 208, 120, 0.7);
                --ring: rgba(252, 246, 186, 0.4);
            }

            * {
                box-sizing: border-box
            }

            html,body {
                margin: 0
            }

            body {
                font-family: 'Inter',system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif;
                color: var(--gold);

                min-height: 100vh;
            }

            .shell {
                max-width: 520px;
                margin: 0 auto;
                padding: 20px 16px 36px;
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            .header {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 12px;
                text-align: center
            }

            .logo {
                border-radius: 1px
            }

            .card {
                background: var(--red-gradient);
                border: 1px solid rgba(212, 175, 55, 0.35);
                border-radius: 14px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 242, 179, 0.2);
                overflow: hidden;
            }

            .hero {
                padding: 12px
            }

            .hero-img {
                border-radius: 10px
            }

            .img-wrap {
                position: relative;
                border-radius: 12px;
                overflow: hidden;
                border: 1px solid rgba(212, 175, 55, 0.2);
            }

            .img-wrap::after {
                content: "";
                position: absolute;
                top: 0%;
                bottom: 0%;
                left: 0%;
                width: 40%;
                transform: skewX(-20deg) translateX(0);
                background: linear-gradient(to right,rgba(255,255,255,0) 0%,rgba(255,242,179,0.4) 50%,rgba(255,255,255,0) 100%);
                opacity: 0;
                pointer-events: none;
            }

            .img-wrap:hover::after {
                opacity: 1;
                animation: sweep 900ms cubic-bezier(.2,.6,.2,1) 1 forwards;
            }

            @keyframes sweep {
                to {
                    transform: skewX(-20deg) translateX(260%);
                }
            }

            .cta {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                margin-top: 12px
            }

            .btn {
                display: inline-block;
                text-decoration: none;
                text-align: center;
                padding: 14px 16px;
                border-radius: 10px;
                font-weight: 700;
                letter-spacing: .5px;
                text-transform: uppercase;
                transition: all .25s ease;
                will-change: background,transform;
            }

            /* Tombol Login - Emas Mewah */
            .btn-primary {
                color: #2b0003;
                background: var(--gold-gradient);
                border: 1px solid #ffe89c;
                box-shadow: 0 4px 15px rgba(179, 135, 40, 0.4);
            }

            .btn-primary:hover {
                background: var(--gold-gradient-hover);
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(252, 246, 186, 0.6);
            }

            /* Tombol Daftar - Merah Gelap Elegan dengan Border Emas */
            .btn-secondary {
                background: linear-gradient(135deg, #4a080d 0%, #1a0204 100%);
                color: #fcf6ba;
                border: 1px solid #b38728;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            }

            .btn-secondary:hover {
                background: linear-gradient(135deg, #660c13 0%, #2b0407 100%);
                border-color: #fcf6ba;
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(179, 135, 40, 0.3);
            }

            .btn:focus-visible {
                outline: 0;
                box-shadow: 0 0 0 4px var(--ring)
            }

            .btn:active {
                transform: translateY(0)
            }

            .features {
                padding: 16px 14px
            }

            .features h2 {
                margin: 0 0 14px;
                font-size: 15px;
                font-weight: 700;
                text-align: center;
                background: var(--gold-gradient);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                letter-spacing: 1px;
            }

            .list {
                margin: 0;
                padding: 0;
                list-style: none;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px
            }

            .item {
                background: linear-gradient(135deg, rgba(40, 5, 8, 0.8), rgba(15, 2, 3, 0.9));
                border: 1px solid rgba(212, 175, 55, 0.25);
                border-radius: 10px;
                padding: 12px 10px;
                font-size: 12px;
                color: #fff5d6;
                display: flex;
                align-items: center;
            }

            .item:before {
                content: "✓";
                margin-right: 8px;
                color: #fcf6ba;
                font-weight: 700;
                text-shadow: 0 0 5px rgba(179, 135, 40, 0.8);
            }

            .footer {
                text-align: center;
                color: var(--muted);
                font-size: 12px;
                margin-top: 8px
            }

            .footer b {
                background: var(--gold-gradient);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }
